name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync --locked --python ${{ matrix.python-version }}

      # `uv run` uses the ruff and ty versions pinned in uv.lock, so a new
      # release cannot turn CI red on its own.
      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Verify the wheel ships its asset
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          assert "petpet_gif/assets/default_overlay.gif" in names, names
          assert "petpet_gif/py.typed" in names, names
          print("wheel ok:", wheel)
          PY
